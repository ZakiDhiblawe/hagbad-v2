<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hagbad - Ayuuto Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .auth-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        #message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .api-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
        }

        .api-info a {
            color: #667eea;
            text-decoration: none;
        }
        
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <h1>🏦 Hagbad System</h1>
            <p class="subtitle">Ayuuto Contribution Management</p>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('register')">Register</button>
                <button class="tab-btn" onclick="showTab('login')">Login</button>
            </div>
            
            <!-- Register Form -->
            <div id="register-tab" class="tab-content active">
                <form id="register-form">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="full-name" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone (Optional)</label>
                        <input type="tel" id="phone">
                    </div>
                    <div class="form-group">
                        <label>Password * (min 6 chars, 1 uppercase, 1 number)</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit">Register</button>
                </form>
            </div>
            
            <!-- Login Form -->
            <div id="login-tab" class="tab-content">
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit">Login</button>
                </form>
            </div>
            
            <div id="message"></div>
            
            <div class="api-info">
                📚 <a href="/docs" target="_blank">API Documentation</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';
        
        // Register user
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const button = e.target.querySelector('button');
            button.textContent = 'Registering...';
            button.disabled = true;
            
            const userData = {
                full_name: document.getElementById('full-name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim() || null,
                password: document.getElementById('password').value
            };
            
            console.log('Sending registration data:', userData);
            
            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });
                
                const data = await response.json();
                console.log('Response:', data);
                
                if (!response.ok) {
                    // Handle validation errors
                    if (response.status === 422) {
                        const errors = data.detail || [];
                        const errorMessages = errors.map(err => {
                            if (err.msg) return err.msg;
                            if (err.loc) return `${err.loc.join('.')}: ${err.msg}`;
                            return JSON.stringify(err);
                        }).join(', ');
                        throw new Error(errorMessages || 'Validation failed');
                    }
                    throw new Error(data.detail || 'Registration failed');
                }
                
                showMessage('✓ Registration successful! Please login.', 'success');
                document.getElementById('register-form').reset();
                
                // Switch to login tab after 2 seconds
                setTimeout(() => {
                    // Trigger click on login tab
                    const loginTab = document.querySelectorAll('.tab-btn')[1];
                    loginTab.click();
                }, 2000);
                
            } catch (error) {
                console.error('Registration error:', error);
                showMessage(error.message, 'error');
            } finally {
                button.textContent = 'Register';
                button.disabled = false;
            }
        });
        
        // Login user
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const button = e.target.querySelector('button');
            button.textContent = 'Logging in...';
            button.disabled = true;
            
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('login-email').value.trim());
            formData.append('password', document.getElementById('login-password').value);
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Login failed');
                }
                
                localStorage.setItem('access_token', data.access_token);
                showMessage('✓ Login successful! Redirecting...', 'success');
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1500);
                
            } catch (error) {
                console.error('Login error:', error);
                showMessage(error.message, 'error');
            } finally {
                button.textContent = 'Login';
                button.disabled = false;
            }
        });
        
        function showMessage(msg, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = msg;
            messageDiv.className = type;
            setTimeout(() => {
                messageDiv.textContent = '';
                messageDiv.className = '';
            }, 5000);
        }
        
        function showTab(tab) {
            // Update buttons
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update content
            const registerTab = document.getElementById('register-tab');
            const loginTab = document.getElementById('login-tab');
            
            if (tab === 'register') {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
            } else {
                registerTab.classList.remove('active');
                loginTab.classList.add('active');
            }
            
            // Clear messages
            document.getElementById('message').textContent = '';
        }
        
        // Test API health on load
        async function testAPI() {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                console.log('API Health:', data);
            } catch (error) {
                console.error('API not reachable:', error);
                showMessage('Cannot connect to server. Make sure backend is running.', 'error');
            }
        }
        
        testAPI();
    </script>
</body>
</html>
