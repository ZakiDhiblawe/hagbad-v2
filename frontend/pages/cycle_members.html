<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="api-base" content="http://localhost:8000" />
  <title>Cycle Participants • Hagbad</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body data-page="cycle_members" data-root="false">
  <div id="app-header"></div>

  <main class="container" aria-labelledby="page-title">
    <div class="hero">
      <h1 id="page-title">Cycle participants</h1>
      <p id="cycle-subtitle">Participation and payout order setup.</p>
    </div>

    <section class="card" aria-label="Cycle participants">
      <div class="card-header">
        <h2 id="cycle-title">—</h2>
        <p id="permissions-note" class="hint"></p>
        <p class="hint">Set participation and payout order here before payments or payouts.</p>
      </div>

      <div class="card-body">
        <div id="page-error" class="form-error" role="alert" hidden></div>

        <div class="toolbar" role="group" aria-label="Cycle participant actions">
          <div class="toolbar-left">
            <button id="open-cycle" class="btn btn-secondary" type="button">Cycle</button>
            <button id="open-group-members" class="btn btn-secondary" type="button">Group members</button>
          </div>
          <div class="toolbar-right">
            <input id="order-filter" type="number" min="1" step="1" placeholder="Filter order" aria-label="Filter by payout order" />
            <button id="refresh" class="btn btn-secondary" type="button">Refresh</button>
            <button id="open-add" class="btn" type="button">Add participant</button>
          </div>
        </div>

        <div id="list-status" class="hint" aria-live="polite"></div>
        <ul id="participants-list" class="list" aria-label="Cycle participants"></ul>

        <div class="pager" aria-label="Pagination">
          <button id="prev" class="btn btn-secondary" type="button">Prev</button>
          <span id="page-label" class="hint">Page 1</span>
          <button id="next" class="btn btn-secondary" type="button">Next</button>
        </div>
      </div>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay" hidden></div>
  <div id="add-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="add-title" hidden>
    <h3 id="add-title">Add cycle participant</h3>
    <p id="eligibility-note" class="hint">Loading group members…</p>

    <form id="add-form" novalidate>
      <div id="form-error" class="form-error" role="alert" hidden></div>

      <div class="field">
        <label for="user_id">Group member</label>
        <select id="user_id" class="select">
          <option value="">Select group member</option>
        </select>
      </div>

      <div class="field">
        <label for="payout_order">Payout order (optional)</label>
        <input id="payout_order" type="number" min="1" step="1" placeholder="Leave empty to auto-assign next order" />
      </div>

      <div class="modal-actions">
        <button id="cancel" class="btn btn-secondary" type="button">Cancel</button>
        <button id="add-submit" class="btn" type="submit">Add participant</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="../js/app.js" defer></script>
  <script src="../modules/user/user_api.js" defer></script>
  <script src="../modules/group/group_api.js" defer></script>
  <script src="../modules/group_member/group_member_api.js" defer></script>
  <script src="../modules/cycle/cycle_api.js" defer></script>
  <script src="../modules/cycle_member/cycle_member_api.js" defer></script>
  <script src="../modules/cycle_member/cycle_member.js" defer></script>
</body>
</html>
