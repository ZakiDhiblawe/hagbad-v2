<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group Review - Hagbad</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="group_review">
    <div id="app-header"></div>

    <main class="page-shell">
        <section class="page-head">
            <div>
                <h1>Group Review</h1>
                <p>Review join requests for groups you manage.</p>
            </div>

            <div class="btn-row">
                <button id="back-to-groups" class="btn btn-secondary" type="button">Back to Groups</button>
                <button id="refresh-page" class="btn btn-secondary" type="button">Refresh</button>
            </div>
        </section>

        <div class="layout" style="grid-template-columns: 1fr;">
            <section class="panel">
                <h2>Group Review</h2>
                <p class="panel-subtitle">Creator or admin can review pending requests for all groups they manage.</p>

                <div id="admin-error" class="alert error" hidden></div>
                <div id="admin-success" class="alert success" hidden></div>
                <div id="admin-info" class="alert info" hidden></div>

                <div class="field">
                    <label for="admin_group_id">Group ID to review</label>
                    <input id="admin_group_id" type="number" min="1" placeholder="Enter group id" />
                    <div class="helper-text">Leave this empty to see requests from all groups you manage.</div>
                </div>

                <div class="field">
                    <label for="status_filter">Filter by status</label>
                    <select id="status_filter">
                        <option value="">All</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>

                <div class="btn-row">
                    <button id="load-group-requests-btn" class="btn btn-primary" type="button">Load Group Requests</button>
                </div>

                <div class="muted-box" style="margin-top:16px;">
                    Approve or reject requests here. Approving adds the user into group members as <strong>member</strong>.
                </div>

                <div id="group-request-list" class="request-list"></div>
            </section>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="../js/app.js?v=5"></script>
    <script src="../modules/join_request/join_request_api.js?v=4"></script>
    <script src="../modules/join_request/join_request.js?v=4"></script>
</body>
</html>
