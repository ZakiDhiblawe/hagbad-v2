<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="api-base" content="http://localhost:8000" />
    <title>Login • Hagbad</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body data-page="login" data-root="false">
    <div id="app-header"></div>

    <main class="container" aria-labelledby="page-title">
        <div class="hero">
            <h1 id="page-title">Welcome back</h1>
            <p>Sign in to continue.</p>
        </div>

        <section class="card" aria-label="Login form">
            <div class="card-header">
                <h2>Login</h2>
                <p>Use your email and password.</p>
            </div>

            <div class="card-body">
                <form id="login-form" novalidate>
                    <div id="form-error" class="form-error" role="alert" hidden></div>
                    <div id="form-success" class="form-success" role="status" aria-live="polite" hidden></div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" autocomplete="email" required
                            placeholder="e.g. test@mail.com" aria-describedby="email-error" />
                        <p id="email-error" class="error" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <div class="input-row">
                            <input id="password" name="password" type="password" autocomplete="current-password"
                                required placeholder="Your password" aria-describedby="password-error" />
                            <button type="button" class="icon-btn" data-toggle-password="password">Show</button>
                        </div>
                        <p id="password-error" class="error" role="alert"></p>
                    </div>

                    <button id="login-submit" class="btn" type="submit">Sign in</button>

                    <p class="footer-note">
                        New here?
                        <a href="register.html">Create an account</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="../js/app.js" defer></script>
    <script src="../modules/user/user_api.js" defer></script>
    <script src="../modules/user/user.js" defer></script>
</body>

</html>
