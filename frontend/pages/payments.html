<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="api-base" content="http://localhost:8000" />
  <title>Payments • Hagbad</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body data-page="payments" data-root="false">
  <div id="app-header"></div>

  <main class="container" aria-labelledby="page-title">
    <div class="hero">
      <h1 id="page-title">Payments</h1>
      <p id="cycle-subtitle">Track due, paid, and late records.</p>
    </div>

    <section id="summary-card" class="card" aria-label="Payment summary" hidden>
      <div class="card-header">
        <h2>Cycle summary</h2>
        <p id="permissions-note" class="hint"></p>
      </div>
      <div class="card-body">
        <div id="summary-error" class="form-error" role="alert" hidden></div>
        <div id="summary-grid" class="stats-grid"></div>
      </div>
    </section>

    <section class="card" aria-label="Payments">
      <div class="card-header">
        <h2 id="cycle-title">—</h2>
        <p id="permissions-note-main" class="hint"></p>
        <p class="hint">Core accounting data for each cycle member contribution.</p>
      </div>

      <div class="card-body">
        <div id="page-error" class="form-error" role="alert" hidden></div>

        <div class="toolbar" role="group" aria-label="Payment actions">
          <div class="toolbar-left">
            <button id="open-cycle" class="btn btn-secondary" type="button">Cycle</button>
            <button id="open-participants" class="btn btn-secondary" type="button">Participants</button>
            <button id="open-payouts" class="btn btn-secondary" type="button">Payouts</button>
          </div>
          <div class="toolbar-right">
            <button id="refresh" class="btn btn-secondary" type="button">Refresh</button>
            <button id="open-create" class="btn" type="button">Create payment</button>
          </div>
        </div>

        <div class="stack" style="margin-top:12px;">
          <select id="cycle_member_id" class="select" aria-label="Filter by participant"></select>
          <select id="status-filter" class="select" aria-label="Filter by payment status">
            <option value="">All statuses</option>
            <option value="due">Due</option>
            <option value="paid">Paid</option>
            <option value="late">Late</option>
          </select>
          <input id="due_from" type="date" aria-label="Due from" />
          <input id="due_to" type="date" aria-label="Due to" />
        </div>

        <div id="list-status" class="hint" aria-live="polite"></div>
        <ul id="payments-list" class="list" aria-label="Payments"></ul>

        <div class="pager" aria-label="Pagination">
          <button id="prev" class="btn btn-secondary" type="button">Prev</button>
          <span id="page-label" class="hint">Page 1</span>
          <button id="next" class="btn btn-secondary" type="button">Next</button>
        </div>
      </div>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay" hidden></div>
  <div id="create-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="create-title" hidden>
    <h3 id="create-title">Create payment</h3>
    <p class="hint">Create one accounting record for one cycle member and one due date.</p>

    <form id="create-form" novalidate>
      <div id="form-error" class="form-error" role="alert" hidden></div>

      <div class="field">
        <label for="create_cycle_member_id">Cycle participant</label>
        <select id="create_cycle_member_id" class="select"></select>
      </div>

      <div class="field">
        <label for="create_due_date">Due date</label>
        <input id="create_due_date" type="date" />
      </div>

      <div class="field">
        <label for="create_amount_due">Amount due (optional)</label>
        <input id="create_amount_due" type="number" min="0.01" step="0.01" placeholder="Leave empty to use group settings amount" />
      </div>

      <div class="field">
        <label for="create_amount_paid">Amount paid</label>
        <input id="create_amount_paid" type="number" min="0" step="0.01" value="0.00" />
      </div>

      <div class="field">
        <label for="create_paid_at">Paid at (optional)</label>
        <input id="create_paid_at" type="datetime-local" />
      </div>

      <div class="field">
        <label for="create_notes">Notes</label>
        <textarea id="create_notes" class="textarea" rows="3" maxlength="2000"></textarea>
      </div>

      <div class="modal-actions">
        <button id="cancel" class="btn btn-secondary" type="button">Cancel</button>
        <button id="create-submit" class="btn" type="submit">Create</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="../js/app.js" defer></script>
  <script src="../modules/user/user_api.js" defer></script>
  <script src="../modules/group/group_api.js" defer></script>
  <script src="../modules/group_member/group_member_api.js" defer></script>
  <script src="../modules/cycle/cycle_api.js" defer></script>
  <script src="../modules/cycle_member/cycle_member_api.js" defer></script>
  <script src="../modules/payment/payment_api.js" defer></script>
  <script src="../modules/payment/payment.js" defer></script>
</body>
</html>
